:root[data-theme="paper"]{--bg:#e8e2d3;--lh:#e8e2d3;--ink:#2b2a26;--mut:#5b574c;--accent:#0c6277;--accent2:#12809b;--soft:#e0e6df;--edge:#c8bfa9;--surf:#f4efe3;--surf2:#ece6d6;--track:#cfc6b0;--warnsoft:#f6e7b8;--panel:rgba(245,241,230,.95);--goodsoft:#dfeadb;--badsoft:#f3dcd6}
:root[data-theme="paper"] .top{background:rgba(238,233,220,.97)}
:root[data-theme="mint"]{--bg:#d6e4dc;--lh:#d6e4dc;--ink:#14302a;--mut:#43594f;--accent:#0b6a58;--accent2:#118a72;--soft:#cfe3d9;--edge:#a9c2b4;--surf:#eef5f0;--surf2:#e2eee7;--track:#bcd3c6;--warnsoft:#f5ecc4;--panel:rgba(238,245,240,.95);--goodsoft:#d7ecdd;--badsoft:#f3dcd6}
:root[data-theme="mint"] .top{background:rgba(226,238,231,.97)}
select.theme{padding:5px 10px;margin-top:6px;appearance:auto;text-transform:none;letter-spacing:.02em;font-size:.9rem}
/* chapters 5, 6, 8, 9 */
.ckt .wave{fill:none;stroke:var(--accent);stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}.ckt .wave2{fill:none;stroke:#c0392b;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.simfig svg .line.l2{stroke:#c0392b}.simfig svg .line.l3{stroke:#14803c}.simfig svg .line.thin{stroke-width:2}
.simfig svg .ar.l2{stroke:#c0392b}.simfig svg .arh.l2{fill:#c0392b}.simfig svg .ar.l3{stroke:#14803c}.simfig svg .arh.l3{fill:#14803c}.simfig svg .ar.l4{stroke:#6a3fb0}.simfig svg .arh.l4{fill:#6a3fb0}
.simfig svg .fillA{fill:#0b6bab22;stroke:none}.simfig svg .plt{stroke:var(--ink);stroke-width:5;stroke-linecap:butt}.simfig svg .fl{stroke:#c0392b;stroke-width:1.6;fill:none}
.simfig svg .st.a{fill:var(--accent);font-weight:700}.simfig svg .st.r{fill:#c0392b;font-weight:700}.simfig svg .st.gn{fill:#14803c;font-weight:700}
.simfig svg .st.pp{fill:#6a3fb0;font-weight:700}.simfig svg .st.am{fill:#b45f00;font-weight:700}
.back{margin:0 0 14px}

.foot{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:space-between;padding:22px 0 30px;font-size:.86rem;color:var(--mut)}.foot a{color:var(--ink);font-weight:700;text-decoration:underline}
.srcl{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:space-between;align-items:center;margin:10px 0 0;font-size:.84rem;color:var(--mut)}.srcl a{color:var(--accent);font-weight:700}
.numhint{margin:6px 0 0;font-size:.84rem;color:var(--mut)}
.howto ol{margin:6px 0 8px;padding-left:22px}.howto li{margin:3px 0}
.clock{font-family:var(--f-mono);font-size:.9rem;color:var(--mut)}.clock.over{color:var(--bad);font-weight:700}
.sheet .srow{padding:10px 0;border-bottom:1px solid var(--edge)}.sheet .srow:last-child{border-bottom:0}.sheet h2{margin:0 0 6px;font-family:var(--f-disp);font-size:1.15rem;color:var(--accent)}.sheet ul{margin:6px 0;padding-left:20px}
@media print{.top,.letterhead,.foot,.back,.chead .row,#nav{display:none!important}body{background:#fff!important}.card{box-shadow:none!important;border:0!important;background:#fff!important}.sheet .srow{break-inside:avoid}.main{padding:0!important}}
@media (max-width:700px){.foot{padding-left:16px;padding-right:16px}}

.idrow{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end}.idf{display:flex;flex-direction:column;gap:4px;font-size:.84rem;font-weight:700;color:var(--mut)}
.hello input,.idf input,#numIn,.numrow input{background:#fff!important;color:#0c2238!important;border:1px solid #9fb0c2;border-radius:9px;padding:10px 12px;min-width:220px;font:inherit;font-size:1rem}
.hello input::placeholder,#numIn::placeholder{color:#6b7c8d}
.who .sid{display:block;font-size:.8rem;color:var(--mut)}.linkb{background:none;border:0;padding:0;color:var(--accent);font:inherit;font-size:.82rem;font-weight:700;text-decoration:underline;cursor:pointer}
@media(max-width:940px){.who .sid{display:inline;margin-left:6px}}
.idcard{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.steps2{margin:10px 0 2px;border:1px solid var(--edge);border-radius:10px;background:var(--surf2);padding:10px 12px}.st2h{font-family:var(--f-disp);font-weight:700;font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.steps2 ol{list-style:none;margin:0;padding:0;display:grid;gap:6px}.steps2 li{display:grid;grid-template-columns:62px 1fr;gap:8px;font-family:var(--f-mono);font-size:.9rem;line-height:1.5;color:var(--ink)}.steps2 li span{font-family:var(--f-disp);font-weight:700;font-size:.78rem;color:var(--accent);padding-top:2px}
.steps2 li.last{font-weight:700}.st2a{margin-top:8px;padding-top:8px;border-top:1px dashed var(--edge);font-weight:700;color:var(--good)}
.excard h2{margin:2px 0 8px;font-family:var(--f-disp);font-size:1.3rem;color:var(--accent)}.exq{font-size:1.02rem;line-height:1.55;margin:0 0 10px}
.gf{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.gf div{background:var(--surf2);border:1px solid var(--edge);border-radius:10px;padding:8px 10px}.gf b{display:block;font-family:var(--f-disp);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:2px}.gf span{font-family:var(--f-mono);font-size:.88rem}
.exsteps{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:8px}.exsteps li{display:grid;grid-template-columns:64px 1fr;gap:8px;padding:8px 10px;border-radius:9px;background:var(--surf2);border:1px solid var(--edge);line-height:1.5;animation:stepin .25s ease-out}.exsteps li span{font-family:var(--f-disp);font-weight:700;color:var(--accent);font-size:.82rem;padding-top:2px}
@keyframes stepin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}@media (prefers-reduced-motion:reduce){.exsteps li{animation:none}}
.exans{font-size:1.02rem}.exprog{margin:8px 0 0;font-size:.82rem}.pill.gen{border-style:dashed}
@media(max-width:700px){.gf{grid-template-columns:1fr}.exsteps li{grid-template-columns:1fr}}
.exwrap{padding:0;margin-bottom:14px}.exwrap>summary{cursor:pointer;list-style:none;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;padding:14px 18px;font-family:var(--f-disp);font-size:1.15rem;font-weight:700;color:var(--ink)}.exwrap>summary::-webkit-details-marker{display:none}.exwrap>summary::before{content:"▸";color:var(--accent);margin-right:2px}.exwrap[open]>summary::before{content:"▾"}.exwrap>summary b{font-family:var(--f-body);font-size:.86rem;font-weight:400;color:var(--mut)}
#exbox{padding:0 16px 16px}#exbox .card{box-shadow:none}.exnote{margin:4px 0 14px}
.btnrow{flex-wrap:wrap}.btnrow .btn{white-space:nowrap}

<script>
(function(){
  // ---------- tiny schematic library: draws every circuit as inline SVG ----------
  var XL = 82, XR = 300, YT = 38, YB = 128, YM = 83;

  function esc(s){ return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
  function lab(s){
    s = esc(s);
    var n = 0;
    s = s.replace(/_\{([^}]*)\}|_([A-Za-z]+|\d+)/g, function(m, a, b){
      n++;
      return '<tspan dy="3" font-size="9.5">' + (a || b) + '</tspan><tspan dy="-3">';
    });
    for (var i = 0; i < n; i++) s += "</tspan>";
    return s;
  }
  function rnd(n){ return Math.round(n * 10) / 10; }
  function pt(p){ return rnd(p[0]) + "," + rnd(p[1]); }

  var P = {};
  P.w = function(pts){ return '<polyline class="w" points="' + pts.map(pt).join(" ") + '"/>'; };
  P.dot = function(x, y){ return '<circle class="dot" cx="' + x + '" cy="' + y + '" r="3.3"/>'; };
  P.term = function(x, y){ return '<circle class="term" cx="' + x + '" cy="' + y + '" r="3.6"/>'; };
  P.t = function(x, y, s, anchor, cls){
    var lines = String(s).split("|");
    var out = '<text x="' + rnd(x) + '" y="' + rnd(y) + '" text-anchor="' + (anchor || "middle") + '"' + (cls ? ' class="' + cls + '"' : "") + ">";
    lines.forEach(function(l, i){
      out += '<tspan x="' + rnd(x) + '"' + (i ? ' dy="14"' : "") + ">" + lab(l) + "</tspan>";
    });
    return out + "</text>";
  };
  // label next to a centre point; side is where the label sits
  P.at = function(cx, cy, text, side, off, cls){
    off = off == null ? 14 : off;
    if (side === "t") return P.t(cx, cy - off, text, "middle", cls);
    if (side === "b") return P.t(cx, cy + off + 8, text, "middle", cls);
    if (side === "l") return P.t(cx - off, cy + 4, text, "end", cls);
    return P.t(cx + off, cy + 4, text, "start", cls);
  };
  P.head = function(x, y, ux, uy, s, cls){
    var nx = -uy, ny = ux;
    var b = [x - ux * s, y - uy * s];
    return '<polygon class="' + (cls || "arh") + '" points="' + pt([x, y]) + " " + pt([b[0] + nx * s * 0.5, b[1] + ny * s * 0.5]) + " " + pt([b[0] - nx * s * 0.5, b[1] - ny * s * 0.5]) + '"/>';
  };
  P.arr = function(x1, y1, x2, y2, label, lx, ly, anchor){
    var dx = x2 - x1, dy = y2 - y1, L = Math.sqrt(dx * dx + dy * dy), ux = dx / L, uy = dy / L;
    var s = '<line class="ar" x1="' + x1 + '" y1="' + y1 + '" x2="' + rnd(x2 - ux * 6) + '" y2="' + rnd(y2 - uy * 6) + '"/>' + P.head(x2, y2, ux, uy, 8);
    if (label) s += P.t(lx, ly, label, anchor || "middle", "acc");
    return s;
  };
  // resistor between two points; side = side of the label
  P.r = function(x1, y1, x2, y2, label, side, o){
    o = o || {};
    var dx = x2 - x1, dy = y2 - y1, L = Math.sqrt(dx * dx + dy * dy), ux = dx / L, uy = dy / L, nx = -uy, ny = ux;
    var B = o.body || 30, s = (L - B) / 2, a = 4.5, seq = [0, 1, -1, 1, -1, 1, 0];
    var pts = [[x1, y1]];
    for (var i = 0; i <= 6; i++){
      var d = s + B * i / 6;
      pts.push([x1 + ux * d + nx * seq[i] * a, y1 + uy * d + ny * seq[i] * a]);
    }
    pts.push([x2, y2]);
    var out = P.w(pts);
    var mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    if (label) out += P.at(mx, my, label, side || "t", o.off == null ? 12 : o.off);
    if (o.pm){
      var opp = { t: [0, 15], b: [0, -11], l: [14, 0], r: [-14, 0] }[side || "t"];
      out += P.t(x1 + ux * 4 + opp[0], y1 + uy * 4 + opp[1] + 4, "+", "middle", "sign");
      out += P.t(x2 - ux * 4 + opp[0], y2 - uy * 4 + opp[1] + 4, "−", "middle", "sign");
    }
    return out;
  };
  // battery: plus = absolute direction of the + terminal (u d l r); leads end 10 px from centre
  P.bat = function(x, y, plus, label, side, o){
    o = o || {};
    var d = { u: [0, -1], d: [0, 1], l: [-1, 0], r: [1, 0] }[plus], n = [-d[1], d[0]];
    function q(a, b){ return [x + d[0] * a + n[0] * b, y + d[1] * a + n[1] * b]; }
    function ln(p1, p2, cls){ return '<line class="' + cls + '" x1="' + rnd(p1[0]) + '" y1="' + rnd(p1[1]) + '" x2="' + rnd(p2[0]) + '" y2="' + rnd(p2[1]) + '"/>'; }
    var out = ln(q(3, -11), q(3, 11), "plate l") + ln(q(-3, -6), q(-3, 6), "plate s") + ln(q(10, 0), q(3, 0), "w") + ln(q(-3, 0), q(-10, 0), "w");
    side = side || "l";
    var opp = { t: [0, 15], b: [0, -11], l: [14, 0], r: [-14, 0] }[side];
    if (!o.nosign){
      out += P.t(x + d[0] * 11 + opp[0], y + d[1] * 11 + opp[1] + 4, "+", "middle", "sign");
      out += P.t(x - d[0] * 11 + opp[0], y - d[1] * 11 + opp[1] + 4, "−", "middle", "sign");
    }
    if (label) out += P.at(x, y, label, side, o.off == null ? 17 : o.off);
    return out;
  };
  P.isrc = function(x, y, dir, label, side){
    var d = { u: [0, -1], d: [0, 1], l: [-1, 0], r: [1, 0] }[dir];
    var out = '<circle class="meter" cx="' + x + '" cy="' + y + '" r="12"/>';
    out += '<line class="ar" x1="' + rnd(x - d[0] * 7) + '" y1="' + rnd(y - d[1] * 7) + '" x2="' + rnd(x + d[0] * 3) + '" y2="' + rnd(y + d[1] * 3) + '"/>';
    out += P.head(x + d[0] * 8, y + d[1] * 8, d[0], d[1], 7);
    if (label) out += P.at(x, y, label, side || "l", 17);
    return out;
  };
  P.m = function(x, y, ch){
    return '<circle class="meter" cx="' + x + '" cy="' + y + '" r="11"/><text class="mt" x="' + x + '" y="' + (y + 5) + '" text-anchor="middle">' + esc(ch) + "</text>";
  };
  P.lamp = function(x, y, dash){
    var c = dash ? "dead" : "w";
    return '<circle class="meter' + (dash ? " dashed" : "") + '" cx="' + x + '" cy="' + y + '" r="12"/><line class="' + c + '" x1="' + rnd(x - 8.5) + '" y1="' + rnd(y - 8.5) + '" x2="' + rnd(x + 8.5) + '" y2="' + rnd(y + 8.5) + '"/><line class="' + c + '" x1="' + rnd(x - 8.5) + '" y1="' + rnd(y + 8.5) + '" x2="' + rnd(x + 8.5) + '" y2="' + rnd(y - 8.5) + '"/>';
  };
  P.gnd = function(x, y){
    return P.w([[x, y], [x, y + 7]]) + P.w([[x - 9, y + 7], [x + 9, y + 7]]) + P.w([[x - 5.5, y + 11.5], [x + 5.5, y + 11.5]]) + P.w([[x - 2, y + 16], [x + 2, y + 16]]);
  };
  // dashed ring (supernode)
  P.ring = function(x, y, w, h){ return '<rect class="ring" x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="14"/>'; };
  // circled number (mesh index)
  P.circ = function(x, y, n){ return '<circle class="mesh" cx="' + x + '" cy="' + y + '" r="9"/><text class="acc" x="' + x + '" y="' + (y + 4.5) + '" text-anchor="middle">' + n + "</text>"; };
  // open switch drawn between (x1,y) and (x2,y)
  P.sw = function(x1, x2, y){
    return P.dot(x1, y) + P.dot(x2, y) + '<line class="w" x1="' + x1 + '" y1="' + y + '" x2="' + (x2 - 8) + '" y2="' + (y - 16) + '"/>';
  };

  // capacitor (two plates), inductor (coil), AC source (sine in a circle); ux,uy = direction of the wire
  P.cap = function(x, y, ux, uy){
    var nx = -uy, ny = ux, a = 12;
    function ln(p, q, c){ return '<line class="' + c + '" x1="' + rnd(p[0]) + '" y1="' + rnd(p[1]) + '" x2="' + rnd(q[0]) + '" y2="' + rnd(q[1]) + '"/>'; }
    return ln([x - ux * 10, y - uy * 10], [x - ux * 3.5, y - uy * 3.5], "w") + ln([x + ux * 3.5, y + uy * 3.5], [x + ux * 10, y + uy * 10], "w") +
      ln([x - ux * 3.5 + nx * a, y - uy * 3.5 + ny * a], [x - ux * 3.5 - nx * a, y - uy * 3.5 - ny * a], "plate l") + ln([x + ux * 3.5 + nx * a, y + uy * 3.5 + ny * a], [x + ux * 3.5 - nx * a, y + uy * 3.5 - ny * a], "plate l");
  };
  P.ind = function(x, y, ux, uy){
    var nx = -uy, ny = ux, n = 4, step = 10, st = -n * step / 2, d = "M" + rnd(x + ux * (st - 10)) + " " + rnd(y + uy * (st - 10)) + " L" + rnd(x + ux * st) + " " + rnd(y + uy * st);
    for (var k = 0; k < n; k++){
      var a = st + k * step, b = a + step, cxp = x + ux * (a + b) / 2 - nx * 13, cyp = y + uy * (a + b) / 2 - ny * 13;
      d += " Q" + rnd(cxp) + " " + rnd(cyp) + " " + rnd(x + ux * b) + " " + rnd(y + uy * b);
    }
    d += " L" + rnd(x + ux * (st + n * step + 10)) + " " + rnd(y + uy * (st + n * step + 10));
    return '<path class="w" d="' + d + '"/>';
  };
  P.acs = function(x, y, ux, uy){
    var d = "M" + (x - 8) + " " + y + " q4 -9 8 0 t8 0";
    return '<circle class="meter" cx="' + x + '" cy="' + y + '" r="14"/><path class="w" d="' + d + '" transform="translate(-0 0)"/>' + '<line class="w" x1="' + rnd(x - ux * 14) + '" y1="' + rnd(y - uy * 14) + '" x2="' + rnd(x - ux * 22) + '" y2="' + rnd(y - uy * 22) + '"/>';
  };
  var EXTRA_HALF = { cap: 10, ind: 30, acs: 14 };
  var HALF = { r: 20, m: 11, lamp: 12, bat: 10, isrc: 12, sw: 35, cap: 10, ind: 30, acs: 14 };
  var DRAW = {
    r: function(it, cx, cy, ux, uy){
      var h = (it.len || 40) / 2;
      return P.r(cx - ux * h, cy - uy * h, cx + ux * h, cy + uy * h, it.lab, it.side, it);
    },
    m: function(it, cx, cy){ return P.m(cx, cy, it.ch) + (it.lab ? P.at(cx, cy, it.lab, it.side || "t", 16) : ""); },
    lamp: function(it, cx, cy){ return P.lamp(cx, cy, it.dash) + (it.lab ? P.at(cx, cy, it.lab, it.side || "r", 17) : ""); },
    bat: function(it, cx, cy){ return P.bat(cx, cy, it.plus, it.lab, it.side, it); },

    ind: function(it, cx, cy, ux, uy){ return P.ind(cx, cy, ux, uy) + (it.lab ? P.at(cx, cy, it.lab, it.side || "t", 22) : ""); },
    acs: function(it, cx, cy, ux, uy){ return P.acs(cx, cy, ux, uy).replace(/<line[^>]*\/>$/, "") + (it.lab ? P.at(cx, cy, it.lab, it.side || "l", 22) : ""); }

  // a straight wire from (x1,y1) to (x2,y2) carrying items; p = distance of an item's centre from the start
  function run(x1, y1, x2, y2, items){
    var dx = x2 - x1, dy = y2 - y1, L = Math.sqrt(dx * dx + dy * dy), ux = dx / L, uy = dy / L;
    var its = (items || []).slice().sort(function(a, b){ return a.p - b.p; });
    var out = "", cur = 0;
    its.forEach(function(it){
      var h = it.h || (it.t === "r" ? (it.len || 40) / 2 : HALF[it.t]);
      var s = it.p - h, e = it.p + h;
      if (s > cur) out += P.w([[x1 + ux * cur, y1 + uy * cur], [x1 + ux * s, y1 + uy * s]]);
      cur = e;
      out += DRAW[it.t](it, x1 + ux * it.p, y1 + uy * it.p, ux, uy);
    });
    if (cur < L) out += P.w([[x1 + ux * cur, y1 + uy * cur], [x2, y2]]);
    return out;
  }
  // items carry c = absolute coordinate along the wire they sit on
  function conv(items, f){
    return (items || []).map(function(it){
      var o = {};
      for (var k in it) o[k] = it[k];
      if (o.c != null) o.p = f(o.c);
      return o;
    });

    var sg = xb >= xa ? 1 : -1;

  }
  // rectangular loop; s = { l, t, r, b } item lists
  function rect(xl, xr, yt, yb, s){
    s = s || {};

function waveFig(o){
  // o.waves = [{ph (deg), cls, lab, amp}], o.marks = [{deg, lab}], o.T = label for the period
  var x0 = 44, x1 = 330, yc = 82, A = 48, s = "", i, k;
  function X(d){ return x0 + (x1 - x0) * d / 360; }
  s += '<line class="dash" x1="' + x0 + '" y1="' + yc + '" x2="' + (x1 + 8) + '" y2="' + yc + '"/><line class="dash" x1="' + x0 + '" y1="' + (yc - A - 6) + '" x2="' + x0 + '" y2="' + (yc + A + 6) + '"/>';
  (o.waves || []).forEach(function(w, wi){
    var pts = [], amp = (w.amp || 1) * A;
    for (k = 0; k <= 120; k++){ var d = k * 3, v = Math.sin((d - (w.ph || 0)) * Math.PI / 180); pts.push(rnd(X(d)) + "," + rnd(yc - amp * v)); }
    s += '<polyline class="' + (wi ? "wave2" : "wave") + '" points="' + pts.join(" ") + '"/>';
    if (w.lab) s += P.t(x1 - 6, wi ? yc + A + 4 : yc - A - 4, w.lab, "end", wi ? "" : "acc");
  });
  (o.marks || []).forEach(function(m){
    var v = Math.sin(m.deg * Math.PI / 180), px = X(m.deg), py = yc - A * v;
    s += '<line class="dash" x1="' + rnd(px) + '" y1="' + yc + '" x2="' + rnd(px) + '" y2="' + rnd(py) + '"/><circle cx="' + rnd(px) + '" cy="' + rnd(py) + '" r="3.6" class="mesh"/>' + P.t(px + 5, py + (v > 0 ? -7 : 14), m.lab, "start", "acc");
  });
  s += P.t(x0 - 4, yc - A + 4, "V_m", "end") + P.t(X(0) + 2, yc + 16, "0", "start") + P.t(X(180), yc + 16, "180°") + P.t(X(360), yc + 16, "360°", "end") + P.t((x0 + x1) / 2, 152, o.T || "ωt (degrees)");
  return svg(s);
}

"2": [ { id: "2.1", t: "Power by three equations", q: "V = 10 V, I = 1 A and R = 10 Ω. Find the power with the three power equations.", given: "V = 10 V, I = 1 A, R = 10 Ω", find: "P", steps: ["P = I V = (1 A)(10 V) = 10 W.", "P = I² R = (1 A)²(10 Ω) = 10 W.", "P = V² / R = (10 V)² / 10 Ω = 10 W.", "All three give the same result, so the equations are equivalent."], ans: "P = 10 W" },
{ id: "2.6", t: "KVL to find a resistor", q: "E = 5 V and I = 0.25 A flow through R₁ = 2.5 Ω, R₂ = 5 Ω, R₃ = ? and R₄ = 4 Ω in series. Find R₃.", given: "E = 5 V, I = 0.25 A, R₁ = 2.5 Ω, R₂ = 5 Ω, R₄ = 4 Ω", find: "R₃", steps: ["KVL #1 around the loop: V₁ + V₂ + V₃ + V₄ − E = 0.", "Known drops with Ohm's law: V₁ = 0.25 × 2.5 = 0.625 V, V₂ = 0.25 × 5 = 1.25 V, V₄ = 0.25 × 4 = 1 V.", "Solve for V₃: V₃ = 5 − 0.625 − 1.25 − 1 = 2.125 V.", "R₃ = V₃ / I = 2.125 V / 0.25 A = 8.5 Ω."], ans: "R₃ = 8.5 Ω", fig: function(){ return bankFig("2", 3); } },
{ id: "2.12", t: "KCL with a supernode", q: "I₁ = 5 A, I₂ = 6 A, I₅ = 4 A and I₆ = 1 A. Find I₃, I₄ and I₇.", given: "I₁ = 5 A, I₂ = 6 A, I₅ = 4 A, I₆ = 1 A", find: "I₃, I₄, I₇", steps: ["Supernode between A and D: the current in equals the current out, so I₇ = I₁ = 5 A.", "Node A: 5 A enters and 6 A leaves, so I₃ must enter: 5 + I₃ = 6, I₃ = 1 A.", "Node B: 6 A enters and 4 A leaves, so I₄ must leave: 6 = I₄ + 4, I₄ = 2 A.", "Check at node C: I₄ = I₃ + I₆, 2 A = 1 A + 1 A ✓"], ans: "I₃ = 1 A, I₄ = 2 A, I₇ = 5 A", fig: function(){ return bankFig("2", 6); } },
{ id: "P1", topic: "Power and energy", t: "Current and resistance of a lamp", q: "A 60 W lamp works on 12 V. Find its current and its resistance.", given: "P = 60 W, V = 12 V", find: "I, R", steps: ["From P = V I: I = P / V = 60 / 12 = 5 A.", "Ohm's law: R = V / I = 12 / 5 = 2.4 Ω.", "Check: P = I² R = 5² × 2.4 = 60 W ✓"], ans: "I = 5 A, R = 2.4 Ω" },
{ id: "P2", topic: "Power and energy", t: "Energy from power and time", q: "A 100 W load works for 5 hours. Find the energy in kWh and in joules.", given: "P = 100 W, t = 5 h", find: "W", steps: ["Power is energy per unit time, so W = P t.", "In kWh: W = 0.1 kW × 5 h = 0.5 kWh.", "In joules: W = 100 W × 5 × 3600 s = 1 800 000 J = 1.8 MJ."], ans: "0.5 kWh = 1.8 MJ" },
{ id: "P3", topic: "Kirchhoff's voltage law (KVL)", t: "KVL in a series loop", q: "E = 24 V drives I = 2 A through R₁, R₂ and R₃ in series. V₁ = 6 V and V₂ = 10 V. Find V₃ and R₃.", given: "E = 24 V, I = 2 A, V₁ = 6 V, V₂ = 10 V", find: "V₃, R₃", steps: ["KVL around the loop: V₁ + V₂ + V₃ − E = 0.", "V₃ = 24 − 6 − 10 = 8 V.", "R₃ = V₃ / I = 8 V / 2 A = 4 Ω."], ans: "V₃ = 8 V, R₃ = 4 Ω" },
{ id: "P4", topic: "Kirchhoff's current law (KCL)", t: "KCL at a node", q: "At a node, I₁ = 8 A and I₃ = 2 A enter and I₂ = 3 A leaves. Find I₄ and its direction.", given: "I₁ = 8 A in, I₃ = 2 A in, I₂ = 3 A out", find: "I₄", steps: ["KCL: ΣI(in) = ΣI(out).", "8 + 2 = 3 + I₄ (assume I₄ leaves).", "I₄ = 7 A. It is positive, so it does leave the node."], ans: "I₄ = 7 A, leaving the node" },
{ id: "P5", topic: "Real voltage source", t: "Terminal voltage of a real source", q: "A real source has V_S = 12 V and R_S = 0.5 Ω. It feeds R_L = 5.5 Ω. Find I and V_ab.", given: "V_S = 12 V, R_S = 0.5 Ω, R_L = 5.5 Ω", find: "I, V_ab", steps: ["I = V_S / (R_S + R_L) = 12 / 6 = 2 A.", "Drop inside the source: I R_S = 2 × 0.5 = 1 V.", "V_ab = V_S − I R_S = 12 − 1 = 11 V.", "Check: V_ab = I R_L = 2 × 5.5 = 11 V ✓"], ans: "I = 2 A, V_ab = 11 V" }
],
"3": [ { id: "3.1", t: "A series circuit", q: "E = 60 V feeds R₁ = 10 kΩ, R₂ = 20 kΩ and R₃ = 30 kΩ in series. Find R_T, I, V₁, V_T and P_T.", given: "E = 60 V, R₁ = 10 kΩ, R₂ = 20 kΩ, R₃ = 30 kΩ", find: "R_T, I, V₁, V_T, P_T", steps: ["R_T = R₁ + R₂ + R₃ = 10 + 20 + 30 = 60 kΩ.", "I = E / R_T = 60 V / 60 kΩ = 1 mA.", "V₁ = I R₁ = 1 mA × 10 kΩ = 10 V.", "V_T = I R_T = 1 mA × 60 kΩ = 60 V = E ✓", "P_T = I E = 1 mA × 60 V = 60 mW. Check: I² R_T = (1 mA)² × 60 kΩ = 60 mW ✓"], ans: "60 kΩ, 1 mA, 10 V, 60 V, 60 mW", fig: function(){ return exSeries("E = 60 V", ["R_1 10 kΩ", "R_2 20 kΩ", "R_3 30 kΩ"]); } },
{ id: "3.2", t: "Voltage-divider rule", q: "E = 60 V feeds R₁ = 10 kΩ, R₂ = 20 kΩ and R₃ = 10 kΩ in series. Find V₂ and V₃ with the VDR.", given: "E = 60 V, R₁ = 10 kΩ, R₂ = 20 kΩ, R₃ = 10 kΩ", find: "V₂, V₃", steps: ["General VDR: V_x = E R_x / R_T, with R_T = 10 + 20 + 10 = 40 kΩ.", "V₂ = 60 V × 20 / 40 = 30 V.", "V₃ = 60 V × 10 / 40 = 15 V.", "Check: V₁ = 60 × 10 / 40 = 15 V, and 15 + 30 + 15 = 60 V ✓"], ans: "V₂ = 30 V, V₃ = 15 V", fig: function(){ return exSeries("E = 60 V", ["R_1 10 kΩ", "R_2 20 kΩ", "R_3 10 kΩ"]); } },
{ id: "3.5", t: "Current-divider rule", q: "I_T = 60 mA divides into R₁ = 10 Ω, R₂ = 20 Ω and R₃ = 30 Ω in parallel. Find I₁, I₂ and I₃.", given: "I_T = 60 mA, R₁ = 10 Ω, R₂ = 20 Ω, R₃ = 30 Ω", find: "I₁, I₂, I₃", steps: ["R_eq = 1 / (1/10 + 1/20 + 1/30) ≈ 5.455 Ω.", "CDR: I_x = I_T R_eq / R_x.", "I₁ = 60 mA × 5.455 / 10 ≈ 32.73 mA.", "I₂ = 60 mA × 5.455 / 20 ≈ 16.37 mA.", "I₃ = 60 mA × 5.455 / 30 ≈ 10.91 mA.", "Check with KCL: 32.73 + 16.37 + 10.91 ≈ 60 mA ✓"], ans: "32.73 mA, 16.37 mA, 10.91 mA", fig: function(){ return exPar("I_T = 60 mA", ["R_1 10 Ω", "R_2 20 Ω", "R_3 30 Ω"]); } },
{ id: "P1", topic: "Series circuit", t: "A series circuit with power check", q: "E = 24 V feeds R₁ = 2 Ω, R₂ = 4 Ω and R₃ = 6 Ω in series. Find I, each voltage and the total power.", given: "E = 24 V, R₁ = 2 Ω, R₂ = 4 Ω, R₃ = 6 Ω", find: "I, V₁, V₂, V₃, P_T", steps: ["R_T = 2 + 4 + 6 = 12 Ω.", "I = E / R_T = 24 / 12 = 2 A.", "V₁ = 2 × 2 = 4 V, V₂ = 2 × 4 = 8 V, V₃ = 2 × 6 = 12 V.", "Check KVL: 4 + 8 + 12 = 24 V ✓", "P_T = E I = 24 × 2 = 48 W."], ans: "I = 2 A; 4, 8, 12 V; 48 W" },
{ id: "P2", topic: "Circuit ground", t: "Single- and double-subscript voltages", q: "E = 18 V feeds R₁ = 3 kΩ (from a to b) and R₂ = 6 kΩ (from b to ground). Find V_a, V_b and V_ab.", given: "E = 18 V, R₁ = 3 kΩ, R₂ = 6 kΩ, ground at the − terminal", find: "V_a, V_b, V_ab", steps: ["Point a is the + terminal: V_a = 18 V.", "VDR for R₂: V_b = 18 × 6 / (3 + 6) = 12 V.", "V_ab = V_a − V_b = 18 − 12 = 6 V (the drop across R₁)."], ans: "V_a = 18 V, V_b = 12 V, V_ab = 6 V" },
{ id: "P3", topic: "Parallel circuit", t: "Three resistors in parallel", q: "E = 12 V is across 6 Ω, 12 Ω and 4 Ω in parallel. Find R_eq, I_T and each branch current.", given: "E = 12 V, 6 Ω, 12 Ω, 4 Ω", find: "R_eq, I_T, branch currents", steps: ["1 / R_eq = 1/6 + 1/12 + 1/4 = 6/12 = 0.5 S, so R_eq = 2 Ω.", "I_T = E / R_eq = 12 / 2 = 6 A.", "Same voltage on each branch: 12/6 = 2 A, 12/12 = 1 A, 12/4 = 3 A.", "Check KCL: 2 + 1 + 3 = 6 A ✓"], ans: "R_eq = 2 Ω, I_T = 6 A; 2 A, 1 A, 3 A" },
{ id: "P4", topic: "Current-divider rule (CDR)", t: "Two-branch current divider", q: "I_T = 9 mA divides between R₁ = 1 kΩ and R₂ = 2 kΩ. Find I₁ and I₂.", given: "I_T = 9 mA, R₁ = 1 kΩ, R₂ = 2 kΩ", find: "I₁, I₂", steps: ["Two-branch CDR: the other resistor goes on top.", "I₁ = I_T R₂ / (R₁ + R₂) = 9 × 2 / 3 = 6 mA.", "I₂ = I_T R₁ / (R₁ + R₂) = 9 × 1 / 3 = 3 mA.", "Check: 6 + 3 = 9 mA; the smaller resistor takes the larger current ✓"], ans: "I₁ = 6 mA, I₂ = 3 mA" },
{ id: "P5", topic: "Series–parallel circuits", t: "Series–parallel step by step", q: "E = 12 V feeds R₁ = 2 Ω in series with 6 Ω // 3 Ω. Find I_T and the current in each parallel resistor.", given: "E = 12 V, R₁ = 2 Ω, 6 Ω // 3 Ω", find: "I_T, I₆, I₃", steps: ["Parallel part: 6 // 3 = 6 × 3 / 9 = 2 Ω.", "R_eq = 2 + 2 = 4 Ω, I_T = 12 / 4 = 3 A.", "Voltage on the parallel part: 3 A × 2 Ω = 6 V.", "I₆ = 6 / 6 = 1 A and I₃ = 6 / 3 = 2 A.", "Check: KVL 3 × 2 + 6 = 12 V and KCL 1 + 2 = 3 A ✓"], ans: "I_T = 3 A, I₆ = 1 A, I₃ = 2 A" }
],
"4": [ { id: "4.1", t: "Voltage source to current source", q: "E = 6 V with R_S = 2 Ω feeds R_L = 10 Ω. Convert to a current source and find I_L both ways.", given: "E = 6 V, R_S = 2 Ω, R_L = 10 Ω", find: "I_S, I_L", steps: ["I_S = E / R_S = 6 V / 2 Ω = 3 A, with R_S = 2 Ω moved in parallel.", "Current-source circuit, CDR: I_L = I_S R_S / (R_S + R_L) = 3 × 2 / 12 = 0.5 A.", "Voltage-source circuit, Ohm's law: I_L = E / (R_S + R_L) = 6 / 12 = 0.5 A.", "Same load current, so the two sources are equivalent ✓"], ans: "I_S = 3 A, I_L = 0.5 A", fig: function(){ return bankFig("4", 0); } },
{ id: "4.2", t: "Current source to voltage source", q: "I_S = 5 A in parallel with R_S = 10 Ω. Find the equivalent voltage source.", given: "I_S = 5 A, R_S = 10 Ω", find: "E_S, R_S", steps: ["R_S keeps its value and moves into series: R_S = 10 Ω.", "E_S = I_S R_S = 5 A × 10 Ω = 50 V.", "The + terminal of E_S is on the side the I_S arrow points to."], ans: "E_S = 50 V with R_S = 10 Ω", fig: function(){ return bankFig("4", 1); } },
{ id: "4.4", t: "Branch current analysis", q: "E₁ = 10 V, E₂ = 5 V, R₁ = 2 Ω, R₂ = 2 Ω and R₃ = 3 Ω. Find the branch currents, P₂ and V₁.", given: "E₁ = 10 V, E₂ = 5 V, R₁ = R₂ = 2 Ω, R₃ = 3 Ω", find: "I₁, I₂, I₃, P₂, V₁", steps: ["Label nodes a and b, choose reference directions and clockwise meshes.", "KCL at node a (n − 1 = 1 equation): I₁ + I₂ = I₃.", "KVL mesh 1: I₁R₁ + I₃R₃ − E₁ = 0, so 2I₁ + 3I₃ = 10.", "KVL mesh 2: −I₂R₂ − I₃R₃ + E₂ = 0, so 2I₂ + 3I₃ = 5.", "Solve (determinants or substitution): I₁ ≈ 2.19 A, I₂ ≈ −0.31 A, I₃ ≈ 1.88 A. The minus sign means I₂ flows opposite to its arrow.", "P₂ = I₂² R₂ = 0.31² × 2 ≈ 0.19 W and V₁ = I₁ R₁ = 2.19 × 2 ≈ 4.38 V.", "Check KCL: 2.19 − 0.31 = 1.88 A ✓"], ans: "I₁ ≈ 2.19 A, I₂ ≈ −0.31 A, I₃ ≈ 1.88 A", fig: function(){ return bankFig("4", 9); } },
{ id: "P1", topic: "Source conversion", t: "Convert, then find the load current", q: "E = 24 V with R_S = 4 Ω feeds R_L = 8 Ω. Convert to a current source and find I_L.", given: "E = 24 V, R_S = 4 Ω, R_L = 8 Ω", find: "I_S, I_L", steps: ["I_S = E / R_S = 24 / 4 = 6 A, with R_S = 4 Ω in parallel.", "CDR: I_L = I_S R_S / (R_S + R_L) = 6 × 4 / 12 = 2 A.", "Check with the voltage source: 24 / (4 + 8) = 2 A ✓"], ans: "I_S = 6 A, I_L = 2 A" },
{ id: "P2", topic: "Source conversion", t: "Current source to voltage source", q: "I_S = 2 A in parallel with R_S = 15 Ω. Find the equivalent voltage source.", given: "I_S = 2 A, R_S = 15 Ω", find: "E, R_S", steps: ["E = I_S R_S = 2 × 15 = 30 V.", "R_S = 15 Ω moves into series.", "The + of E is on the side the I_S arrow points to."], ans: "E = 30 V in series with 15 Ω" },
{ id: "P3", topic: "Sources in series and parallel", t: "Voltage sources in series", q: "E₁ = 9 V aids the current and E₂ = 3 V opposes it in a loop with R = 3 Ω. Find I.", given: "E₁ = 9 V aiding, E₂ = 3 V opposing, R = 3 Ω", find: "I", steps: ["Add the sources with signs: E = 9 − 3 = 6 V.", "I = E / R = 6 / 3 = 2 A, in the direction set by E₁."], ans: "I = 2 A" },
{ id: "P4", topic: "Sources in series and parallel", t: "Current sources in parallel", q: "5 A (up) with 10 Ω and 2 A (down) with 10 Ω are in parallel and feed R_L = 5 Ω. Find the combined source and V_L.", given: "5 A up, 2 A down, two 10 Ω, R_L = 5 Ω", find: "I_S, R_S, V_L", steps: ["Combine with signs: I_S = 5 − 2 = 3 A (up).", "Combine the parallel resistors: R_S = 10 // 10 = 5 Ω.", "Total resistance with the load: 5 // 5 = 2.5 Ω.", "V_L = I_S × 2.5 Ω = 3 × 2.5 = 7.5 V."], ans: "I_S = 3 A, R_S = 5 Ω, V_L = 7.5 V" },
{ id: "P5", topic: "Branch current analysis", t: "Branch currents with two sources", q: "Same layout as Example 4.4 with E₁ = 12 V, E₂ = 6 V, R₁ = R₂ = 2 Ω and R₃ = 4 Ω. Find I₁, I₂ and I₃.", given: "E₁ = 12 V, E₂ = 6 V, R₁ = R₂ = 2 Ω, R₃ = 4 Ω", find: "I₁, I₂, I₃", steps: ["KCL at node a: I₁ + I₂ = I₃.", "Mesh 1: 2I₁ + 4I₃ = 12. Mesh 2: 2I₂ + 4I₃ = 6.", "Put I₃ = I₁ + I₂: 6I₁ + 4I₂ = 12 and 4I₁ + 6I₂ = 6.", "Solve: I₁ = 2.4 A, I₂ = −0.6 A, I₃ = 1.8 A.", "Check mesh 1: 2(2.4) + 4(1.8) = 12 ✓; mesh 2: 2(−0.6) + 4(1.8) = 6 ✓"], ans: "I₁ = 2.4 A, I₂ = −0.6 A, I₃ = 1.8 A", fig: function(){ return bankFig("4", 9); } }
],
"5": [ { id: "5.1", t: "Superposition", q: "E₁ = 48 V, E₂ = 24 V, R₁ = R₂ = R₃ = R₄ = 8 Ω, R₅ = 16 Ω. Find I_c in R₅.", given: "E₁ = 48 V, E₂ = 24 V, R₁…R₄ = 8 Ω, R₅ = 16 Ω", find: "I_c", steps: ["E₁ alone (E₂ shorted): R′eq = R₅ // (R₃ + R₄) + (R₁ + R₂) = 16 // 16 + 16 = 24 Ω.", "I_a′ = E₁ / R′eq = 48 / 24 = 2 A.", "CDR into R₅: I_c′ = 2 × 16 / (16 + 16) = 1 A.", "E₂ alone (E₁ shorted): R″eq = 24 Ω, I_b″ = 24 / 24 = 1 A, I_c″ = 1 × 16 / 32 = 0.5 A.", "Both flow the same way in R₅: I_c = I_c′ + I_c″ = 1.5 A."], ans: "I_c = 1.5 A", fig: function(){ return bankFig("5", 8); } },
{ id: "5.4", t: "Thevenin's theorem", q: "E = 48 V, R₁ = R₂ = R₃ = 12 Ω, R_L = 8 Ω. Find I_L with Thevenin's theorem.", given: "E = 48 V, R₁ = R₂ = R₃ = 12 Ω, R_L = 8 Ω", find: "I_L", steps: ["Remove R_L and mark the terminals a and b.", "R_TH: short E. R_TH = R₁ // R₂ // R₃ = 12 // 12 // 12 = 4 Ω.", "V_TH = V_ab: VDR on R₁ and R₂ // R₃: V_TH = 48 × 6 / (12 + 6) = 16 V.", "Reconnect R_L to the Thevenin circuit: I_L = V_TH / (R_TH + R_L) = 16 / (4 + 8).", "I_L ≈ 1.33 A."], ans: "I_L ≈ 1.33 A", fig: function(){ return bankFig("5", 1); } },
{ id: "5.6", t: "Norton with a current source", q: "I = 1 mA, R₁ = R₂ = 200 Ω, R₃ = 400 Ω, R₄ = 500 Ω and R_L = 100 Ω. Find I_L.", given: "I = 1 mA, R₁ = R₂ = 200 Ω, R₃ = 400 Ω, R₄ = 500 Ω, R_L = 100 Ω", find: "I_L", steps: ["Remove R_L. Open the current source to find R_N.", "R_N = (R₁ // R₂ + R₃) // R₄ = (100 + 400) // 500 = 250 Ω.", "Short a and b: all of I flows through the short, so I_N = I = 1 mA.", "I_L = I_N R_N / (R_N + R_L) = 1 mA × 250 / 350 ≈ 0.71 mA."], ans: "I_L ≈ 0.71 mA", fig: function(){ return bankFig("5", 5); } },
{ id: "P1", topic: "Superposition theorem", t: "Superposition with a current source", q: "E = 12 V with R₁ = 4 Ω feeds a node. A current source I = 2 A also feeds the node. R₂ = 6 Ω goes from the node to the return line. Find I₂.", given: "E = 12 V, R₁ = 4 Ω, I = 2 A, R₂ = 6 Ω", find: "I₂", steps: ["E alone (current source opened): I₂′ = 12 / (4 + 6) = 1.2 A.", "I alone (E shorted): CDR between R₁ and R₂: I₂″ = 2 × 4 / (4 + 6) = 0.8 A.", "Both flow down through R₂: I₂ = 1.2 + 0.8 = 2 A.", "Check: V(node) = 2 × 6 = 12 V, so R₁ carries 0 A and KCL gives 0 + 2 = 2 A ✓"], ans: "I₂ = 2 A" },
{ id: "P2", topic: "Thevenin's theorem", t: "Thevenin equivalent of a divider", q: "E = 30 V, R₁ = 10 Ω in series, R₂ = 15 Ω across the terminals a and b, and R_L = 6 Ω. Find V_TH, R_TH and I_L.", given: "E = 30 V, R₁ = 10 Ω, R₂ = 15 Ω, R_L = 6 Ω", find: "V_TH, R_TH, I_L", steps: ["Remove R_L. V_TH = V_ab = 30 × 15 / (10 + 15) = 18 V.", "Short E: R_TH = 10 // 15 = 6 Ω.", "I_L = V_TH / (R_TH + R_L) = 18 / 12 = 1.5 A."], ans: "V_TH = 18 V, R_TH = 6 Ω, I_L = 1.5 A", fig: function(){ return figThevEq("V_TH = 18 V", "R_TH = 6 Ω", "R_L = 6 Ω"); } },
{ id: "P3", topic: "Norton's theorem", t: "Norton equivalent of the same divider", q: "Same network as Practice 2 (E = 30 V, R₁ = 10 Ω, R₂ = 15 Ω). Find I_N and the current in R_L = 12 Ω.", given: "E = 30 V, R₁ = 10 Ω, R₂ = 15 Ω, R_L = 12 Ω", find: "I_N, I_L", steps: ["Short a and b: R₂ is bypassed, so I_N = E / R₁ = 30 / 10 = 3 A.", "R_N = R_TH = 6 Ω.", "CDR: I_L = 3 × 6 / (6 + 12) = 1 A.", "Check with Thevenin: 18 / (6 + 12) = 1 A ✓"], ans: "I_N = 3 A, I_L = 1 A", fig: function(){ return figNorton("I_N = 3 A", "R_N = 6 Ω", "R_L = 12 Ω"); } },
{ id: "P4", topic: "Thevenin's theorem", t: "Thevenin with a series resistor", q: "E = 20 V, R₁ = 4 Ω in series, R₂ = 4 Ω across, then R₃ = 3 Ω in series to terminal a. Find V_TH and R_TH, and I_L for R_L = 5 Ω.", given: "E = 20 V, R₁ = 4 Ω, R₂ = 4 Ω, R₃ = 3 Ω, R_L = 5 Ω", find: "V_TH, R_TH, I_L", steps: ["With a and b open, no current flows in R₃, so V_TH = voltage on R₂ = 20 × 4 / 8 = 10 V.", "Short E: R_TH = (4 // 4) + 3 = 2 + 3 = 5 Ω.", "I_L = 10 / (5 + 5) = 1 A."], ans: "V_TH = 10 V, R_TH = 5 Ω, I_L = 1 A" },
{ id: "P5", topic: "Maximum power transfer", t: "Maximum power and a smaller load", q: "V_TH = 24 V and R_TH = 8 Ω. Find the best load, P_max, and the power for R_L = 4 Ω.", given: "V_TH = 24 V, R_TH = 8 Ω", find: "R_L, P_max, P(4 Ω)", steps: ["Maximum power at R_L = R_TH = 8 Ω.", "P_max = V_TH² / (4 R_TH) = 576 / 32 = 18 W.", "R_L = 4 Ω: I = 24 / 12 = 2 A, P = 2² × 4 = 16 W, less than 18 W."], ans: "R_L = 8 Ω, P_max = 18 W, 16 W at 4 Ω", fig: function(){ return figThevEq("V_TH = 24 V", "R_TH = 8 Ω", "R_L = ?"); } }
],
"6": [ { id: "6.2", t: "Capacitance from the plates", q: "A = 0.004 m², d = 0.006 m and the dielectric is mica. Find C.", given: "A = 0.004 m², d = 0.006 m, k(mica) = 5", find: "C", steps: ["Example 6.2 takes k = 5 for mica.", "C = 8.85×10⁻¹² k A / d.", "C = 8.85×10⁻¹² × 5 × 0.004 / 0.006.", "C ≈ 29.5×10⁻¹² F = 29.5 pF."], ans: "C ≈ 29.5 pF", fig: function(){ return bankFig("6", 1); } },
{ id: "6.4", t: "Capacitors in series", q: "Four 100 μF capacitors are in series on E = 25 V. Find the charge on each.", given: "C₁ = C₂ = C₃ = C₄ = 100 μF, E = 25 V", find: "Q", steps: ["Series: 1 / C_eq = 1/100 + 1/100 + 1/100 + 1/100 = 4/100 per μF.", "C_eq = 25 μF (smaller than any single capacitor).", "Q = C_eq E = 25 μF × 25 V = 625 μC.", "In series every capacitor carries the same charge: 625 μC each."], ans: "Q = 625 μC on each", fig: function(){ return bankFig("6", 3); } },

var SIMS = {};
function nf(x, d){ var s = (+x).toFixed(d == null ? 2 : d); if (s.indexOf(".") >= 0) s = s.replace(/0+$/, "").replace(/\.$/, ""); return s === "-0" ? "0" : s; }
function spd1(I){ return Math.max(-0.7, Math.min(0.7, I * 0.06)); }
function flow(pts, ph, cls, gap){
  var L = [], tot = 0, i, k, n, o = "";
  for (i = 1; i < pts.length; i++){ var d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); L.push(d); tot += d; }
  n = Math.max(2, Math.round(tot / (gap || 34)));
  for (k = 0; k < n; k++){
    var f = ((((ph + k / n) % 1) + 1) % 1) * tot, j = 0;

// ===== number generators: every call makes a new question with new values =====
var GENS = { "1": [], "2": [], "3": [], "4": [] };
function ri(a, b){ return a + Math.floor(Math.random() * (b - a + 1)); }
function pk(a){ return a[Math.floor(Math.random() * a.length)]; }
function rd(x){ return Math.round(x * 1e6) / 1e6; }
function nn(x){ return String(parseFloat(Number(x).toPrecision(5))); }
function G(ch, id, topic, make){ GENS[ch].push({ id: id, topic: topic, make: make }); }

var COLS = ["#111111", "#7b4a2a", "#d62828", "#f4820a", "#f2d000", "#2a9d3f", "#2563c9", "#7a3fb0", "#888888", "#f4f4f4"];
function resFig(d1, d2, m){
  var s = P.w([[40, YM], [100, YM]]) + P.w([[260, YM], [320, YM]]) + '<rect x="100" y="60" width="160" height="46" rx="14" fill="#e3d5b3" stroke="#1b2a3a" stroke-width="2"/>';
  [[122, COLS[d1]], [148, COLS[d2]], [174, COLS[m]], [226, "#c9a227"]].forEach(function(b){ s += '<rect x="' + b[0] + '" y="60" width="13" height="46" fill="' + b[1] + '" stroke="#0003" stroke-width=".6"/>'; });
  return svg(s);
}
function ohmFig(E, R, I, vmeter){
  var g = rect(XL, XR, YT, YB, { l: [B(E)], r: [{ t: "r", c: YM, lab: R, side: "l" }], b: [{ t: "m", c: 215, ch: "A", lab: I, side: "b" }] });
  if (vmeter) g += vrun(150, YT, YB, [{ t: "m", c: YM, ch: "V", lab: vmeter, side: "r" }]) + dots([[150, YT], [150, YB]]);
  return svg(g);
}
function lampFig(vlab, note){
  return svg(rect(XL, XR, YT, YB, { l: [B("E")], r: [{ t: "lamp", c: YM }] }) + vrun(230, YT, YB, [{ t: "m", c: YM, ch: "V", lab: vlab, side: "r" }]) + dots([[230, YT], [230, YB]]) + P.t(150, 79, note));
}
function chargeFig(ilab, note){
  return svg(rect(XL, XR, YT, YB, { l: [B("E")], t: [{ t: "m", c: 190, ch: "A", lab: ilab, side: "t" }], r: [{ t: "r", c: YM, lab: "R", side: "l" }] }) + P.t(190, 104, note));
}

function stepsOf(text, finalLabel){

var SIPF = { p: 1e-12, n: 1e-9, u: 1e-6, "µ": 1e-6, "μ": 1e-6, m: 1e-3, k: 1e3, K: 1e3, M: 1e6 };

  var s = allStats(), h = '<h1 class="ph">My progress</h1><section class="card idcard"><div><b>' + esc2(STORE.name || "Name not set") + '</b><span class="mut"> · University ID: ' + esc2(STORE.sid || "not set") + '</span></div><button class="btn sm ghost" data-a="editid">Edit name and ID</button></section><div class="stats">'  + stat(s.n, "Answers given") + stat(s.acc == null ? "–" : s.acc + "%", "Accuracy") + stat(STORE.quizzes.length, "Quizzes taken") + stat(streak(), "Day streak") + "</div>";
  h += CHAPTER_IDS.map(function(c){ var rows = topicsOf(c).map(function(t){ var x = STORE.t[c + "|" + t], p = x && x.n ? Math.round(100 * x.r / x.n) : null; return '<div class="trow"><span>' + t + '</span><span class="mut">' + (x ? x.r + " / " + x.n : "not tried") + "</span>" + bar(p || 0, p == null ? "" : p >= 80 ? "ok" : p < 60 ? "low" : "") + "<span>" + (p == null ? "–" : p + "%") + "</span></div>"; }).join("");
    return '<section class="card"><h2 class="sh">' + chL(c) + " · " + CHAPTERS[c].title + "</h2>" + rows + "</section>"; }).join("");
  h += quizHistory() + '<section class="card"><h2 class="sh">Share or reset</h2><p class="mut">Your progress is stored in this browser only' + (memOnly ? " (storage is blocked, so it will be lost when you close the page)" : "") + '. To show your instructor, copy or save the summary.</p><div class="row"><button class="btn" data-a="copysum">Copy summary</button><button class="btn ghost" data-a="dlsum">Save as text file</button><button class="btn ghost danger" data-a="reset">Reset all progress</button></div><div id="sumMsg" class="mut"></div></section>';
  $("page").innerHTML = h;
}
function summaryText(){
  var s = allStats(), t = "ME0212 Study Lab progress\nName: " + (STORE.name || "(not set)") + "\nUniversity ID: " + (STORE.sid || "(not set)") + "\nDate: " + today() + "\nAnswers: " + s.n + ", accuracy: " + (s.acc == null ? "-" : s.acc + "%") + ", questions seen: " + s.seen + " of " + s.total + "\n";
  CHAPTER_IDS.forEach(function(c){ var x = chStats(c); t += "" + chL(c) + ": " + x.seen + "/" + x.total + " seen, accuracy " + (x.acc == null ? "-" : x.acc + "%") + "\n"; });
  STORE.quizzes.slice(-10).forEach(function(q){ t += "Quiz " + q.date + " " + chL(q.ch) + ": " + q.score + "/" + q.total + "\n"; });
  return t;
}

// ---------- events ----------
document.addEventListener("click", function(e){
  var b = e.target.closest("[data-a]"); if (!b || b.tagName === "SELECT") return;
  var a = b.dataset.a, v = b.dataset.v;
  if (a === "go") go(v);
  else if (a === "back") goBack();
  else if (a === "study") go("study", v);
  else if (a === "tab"){ S.tab = v; pStudy(); }
  else if (a === "tool"){ }
  else if (a === "prac"){ PR.ch = v; PR.topic = "all"; PR.q = null; go("practice"); }
  else if (a === "praction"){ var p = v.split("|"); PR.ch = p[0]; PR.topic = p[1]; PR.q = null; go("practice"); }
  else if (a === "quizch"){ QZ = null; QZCH = v; go("quiz"); }
  else if (a === "setname"){ var n = $("nameIn").value.trim(), id = $("sidIn").value.trim();
    if (!n || !/^[0-9A-Za-z-]{4,20}$/.test(id)){ $("idmsg").textContent = !n ? "Enter your full name." : "Enter your university ID (digits only, at least 4)."; return; }
    STORE.name = n; STORE.sid = id; S.editId = false; saveStore(); render(); }
  else if (a === "editid"){ S.editId = true; go("dash"); }
  else if (a === "opt"){ var i = +v; if (S.page === "quiz"){ QZ.cur = { picked: i }; document.querySelectorAll(".opt").forEach(function(o, k){ o.classList.toggle("pick", k === i); }); }
    else if (!PR.done){ var ok = i === PR.q.correct; PR.done = true; PR.res = { ok: ok, picked: i }; PR.ses.n++; if (ok) PR.ses.r++; record(PR.q.d, ok); drawQ(); } }
  else if (a === "check") check();
  else if (a === "reveal"){ PR.done = true; PR.res = { ok: true }; drawQ(); }
  else if (a === "self"){ var okk = v === "1"; PR.ses.n++; if (okk) PR.ses.r++; record(PR.q.d, okk); nextPractice(); }
  else if (a === "next") nextPractice();
  else if (a === "startquiz") startQuiz();
  else if (a === "qnext") qnext();
  else if (a === "quitquiz"){ QZ = null; render(); }
  else if (a === "hidehelp"){ STORE.help = 0; saveStore(); render(); }
  else if (a === "sheet"){ go("sheet", v); }
  else if (a === "print"){ window.print(); }
  else if (a === "againquiz"){ QZ = null; render(); }
  else if (a === "copysum"){ var t = summaryText(); function done(){ $("sumMsg").textContent = "Copied."; } if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, function(){ $("sumMsg").textContent = "Copy is blocked here. Use Save as text file."; }); else $("sumMsg").textContent = "Copy is blocked here. Use Save as text file."; }
  else if (a === "dlsum"){ var bl = new Blob([summaryText()], { type: "text/plain" }), u = URL.createObjectURL(bl), l = document.createElement("a"); l.href = u; l.download = "ME0212_progress.txt"; document.body.appendChild(l); l.click(); l.remove(); setTimeout(function(){ URL.revokeObjectURL(u); }, 500); }
  else if (a === "reset"){ if (confirm("Delete all your progress on this device?")){ STORE = { name: STORE.name, sid: STORE.sid, help: STORE.help, a: {}, t: {}, quizzes: [], days: [], seen: 0 }; saveStore(); render(); } }
  else if (b.dataset.tool != null){ }
});
document.addEventListener("change", function(e){
  var t = e.target;
  if (t.dataset.a === "pf"){ PR.ch = $("fch").value; if (t.id === "fch") PR.topic = "all"; else PR.topic = $("ftp").value; PR.type = $("fty").value; PR.q = null; PR.last = null; pPractice(); }
  if (t.id === "qch") QZCH = t.value; if (t.id === "qn") QZN = +t.value;
});

document.addEventListener("click", function(e){ var b = e.target.closest("button"); if (b && b.dataset.tool != null && S.page === "study"){ CALC[S.ch] = +b.dataset.tool; rCalc(); } });
loadStore(); render();

// subscripts: turn R_TH into R with a subscript TH in every rendered page text
(function(){
  function subify(root){
    var w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null), list = [], n;
    while ((n = w.nextNode())){ if (/_[A-Za-z]/.test(n.nodeValue) && !/^(SCRIPT|STYLE|TEXTAREA|OPTION|TSPAN|TEXT|svg)$/i.test(n.parentNode.nodeName) && !n.parentNode.closest("svg,textarea,select,input,.mono")) list.push(n); }
    list.forEach(function(t){
      var f = document.createDocumentFragment(), parts = t.nodeValue.split(/(_[A-Za-z]+)/);
      parts.forEach(function(p){ if (/^_[A-Za-z]+$/.test(p)){ var s = document.createElement("sub"); s.textContent = p.slice(1); f.appendChild(s); } else if (p) f.appendChild(document.createTextNode(p)); });
      t.parentNode.replaceChild(f, t);
    });
  }
  function start(){
    var pg = document.getElementById("page"); if (!pg) return;
    var busy = false, mo = new MutationObserver(function(){ if (busy) return; busy = true; try { subify(pg); } finally { busy = false; } });
    mo.observe(pg, { childList: true, subtree: true }); subify(pg);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start); else start();
})();

})();
